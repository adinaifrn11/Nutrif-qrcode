<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil</title>

    <!-- fonte -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../static/style/perfil.css">
</head>
<body>

    <div id="cabecalho">

        <div class="logo">
            <img src="../static/images/logo.png" alt="Logo NUTRIF">
            <h1>NUTRIF</h1>
        </div>

        <div class="usuario">
            <div class="foto-usuario"></div>
            <p>Maria</p>
            <span>⌄</span>
        </div>

    </div>

    <div id="perfil-container">

        <div class="titulo-pagina">
            <h2>Meu perfil</h2>
        </div>

        <div class="cartao-usuario">
            <div class="foto-perfil-grande"></div>
            <div class="info-usuario">
                <h3>Maria lourrane</h3>
                <p>Informática para Internet</p>
            </div>
        </div>

        <div class="cartao-detalhes">
            <div class="item-detalhe">
                <img src="../images/usuario-icon.svg" alt="Ícone Matrícula">
                <p>Matricula : <span>20231041110034</span></p>
            </div>
            <div class="item-detalhe">
                <img src="../images/email-icon.svg" alt="Ícone Email">
                <p>E-mail: <span>maria@escolar.edu.br</span></p>
            </div>
        </div>

        <div class="cartao-qrcode">
            <div class="imagem-qrcode">
                <img src="../images/qrcode.png" alt="Meu QR Code">
            </div>
            <div class="texto-qrcode">
                <h4>Meu QR code</h4>
                <p>Apresente para validação das refeições</p>
            </div>
        </div>

        <div class="botao-sair">
            <a href="login.html">
                <img src="../images/sair-icon.svg" alt="Ícone Sair">
                Sair
            </a>
        </div>

    </div>
