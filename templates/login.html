<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUTRIF</title>
    <link rel="stylesheet" href="../static/style/login.css">
</head>
<body>

    <div class="container">
        <header class="header">
            <div class="logo">
                <img src="../static/images/logo.png" alt="NUTRIF">
                <h1>NUTRIF</h1>
                <p>Alimentação escolar de forma simples e segura.</p>
            </div>
        </header>

        <main class="login-card">
            <div class="info">
                <h2>Bem-vindo(a)!</h2>
                <p>Acesse sua conta para utilizar o sistema NUTRIF</p>

            </div>  

            <form>
                <div class="campo">
                    <input type="text" placeholder="Matrícula" required>
                </div>

                <div class="campo">
                    <input type="password" placeholder="Senha" required>
                </div>

                <button type="submit">ENTRAR</button>
            </form>

            <p>Acesso exclusivo para estudantes.</p>
        </main>
    </div>

</body>
</html>
